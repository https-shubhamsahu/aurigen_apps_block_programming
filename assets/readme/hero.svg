<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Aurigen: drag blocks in a browser tab, flash a real ESP32 over USB</title>
  <desc id="desc">The Blink example three ways. Left: four Blockly blocks, set pin GPIO 16 to HIGH, wait 500 milliseconds, set pin GPIO 16 to LOW, wait 500 milliseconds. Middle: the Arduino C++ you get from them. Right: an ESP32 DevKit V1 with an LED on GPIO 16. The highlighted block, the matching C++ line and the LED state step through the program together.</desc>
  <style>
    .s { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'Noto Sans Mono', monospace; }
    .b { font-weight: 700; }
    .xb { font-weight: 800; }
    .hl1, .hl2, .hl3, .hl4, .on, .off { animation-duration: 4s; animation-iteration-count: infinite; animation-timing-function: linear; }
    .hl1 { animation-name: p1; }
    .hl2 { opacity: 0; animation-name: p2; }
    .hl3 { opacity: 0; animation-name: p3; }
    .hl4 { opacity: 0; animation-name: p4; }
    .on  { animation-name: ledon; }
    .off { visibility: hidden; animation-name: ledoff; }
    @keyframes p1 { 0%, 23% { opacity: 1; } 25%, 98% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes p2 { 0%, 23% { opacity: 0; } 25%, 48% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes p3 { 0%, 48% { opacity: 0; } 50%, 73% { opacity: 1; } 75%, 100% { opacity: 0; } }
    @keyframes p4 { 0%, 73% { opacity: 0; } 75%, 98% { opacity: 1; } 100% { opacity: 0; } }
    /* the LED switches instantly, like the pin; visibility also keeps the glow off a compositor layer */
    @keyframes ledon { 0%, 49.9% { visibility: visible; } 50%, 99.9% { visibility: hidden; } 100% { visibility: visible; } }
    @keyframes ledoff { 0%, 49.9% { visibility: hidden; } 50%, 99.9% { visibility: visible; } 100% { visibility: hidden; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <defs>
    <radialGradient id="glow"><stop offset="0" stop-color="#FFE45C" stop-opacity="0.95"/><stop offset="1" stop-color="#FFD400" stop-opacity="0"/></radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D7DBE0"/><stop offset="0.5" stop-color="#AEB4BB"/><stop offset="1" stop-color="#878D95"/></linearGradient>
  </defs>
