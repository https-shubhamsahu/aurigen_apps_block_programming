    <text x="504" y="302" class="m" font-size="19" fill="#A2A2AA">void<tspan fill="#F4F4F5"> setup() {</tspan></text>
    <text x="526.8" y="324" class="m" font-size="19" fill="#F4F4F5">Serial.begin(115200);</text>
    <text x="526.8" y="346" class="m" font-size="19" fill="#F4F4F5">pinMode(16, OUTPUT);</text>
    <text x="504.0" y="368" class="m" font-size="19" fill="#F4F4F5">}</text>
    <text x="504" y="390" class="m" font-size="19" fill="#A2A2AA">void<tspan fill="#F4F4F5"> loop() {</tspan></text>
    <text x="526.8" y="412" class="m" font-size="19" fill="#F4F4F5">digitalWrite(16, HIGH);</text>
    <text x="526.8" y="434" class="m" font-size="19" fill="#F4F4F5">delay(500);</text>
    <text x="526.8" y="456" class="m" font-size="19" fill="#F4F4F5">digitalWrite(16, LOW);</text>
    <text x="526.8" y="478" class="m" font-size="19" fill="#F4F4F5">delay(500);</text>
    <text x="504.0" y="500" class="m" font-size="19" fill="#F4F4F5">}</text>
  </g>
