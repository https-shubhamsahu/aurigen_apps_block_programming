  <g id="title-block">
    <text x="56" y="116" class="s xb" font-size="76" fill="#F4F4F5" letter-spacing="-1">Aurigen<tspan fill="#FFD400">.</tspan></text>
    <text x="56" y="166" class="s b" font-size="30" fill="#F4F4F5">Drag blocks in a browser tab. Flash a real ESP32 over USB.</text>
    <text x="56" y="206" class="m" font-size="21" fill="#A2A2AA">Blockly → Arduino C++ → arduino-cli in the cloud → Web Serial</text>
    <text x="1144" y="72" class="m" font-size="19" fill="#A2A2AA" text-anchor="end">aurigen-apps.vercel.app</text>
  </g>
