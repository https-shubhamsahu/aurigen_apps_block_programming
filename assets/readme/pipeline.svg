  <path d="M880.0,310 V330" fill="none" stroke="#3A3A40" stroke-width="4" stroke-linejoin="round"/>
  <path d="M880.0,400 V420" fill="none" stroke="#3A3A40" stroke-width="4" stroke-linejoin="round"/>
  <path d="M632,455.0 H600.0 V545.0 H568" fill="none" stroke="#3A3A40" stroke-width="4" stroke-linejoin="round"/>
  <path d="M320.0,580 V620" fill="none" stroke="#3A3A40" stroke-width="4" stroke-linejoin="round"/>
  <text x="544" y="282.0" class="m" font-size="20" fill="#A2A2AA" text-anchor="end">{ cpp, board }</text>
  <text x="544" y="462.0" class="m" font-size="20" fill="#A2A2AA" text-anchor="end">[{ offset, url }, ...]</text>
  <path class="c0" d="M568,185.0 H600.0 V275.0 H632" pathLength="100" stroke-dasharray="100" fill="none" stroke="#FFD400" stroke-width="4" stroke-linejoin="round"/>
  <path class="c1" d="M880.0,310 V330" pathLength="100" stroke-dasharray="100" fill="none" stroke="#FFD400" stroke-width="4" stroke-linejoin="round"/>
  <path class="c2" d="M880.0,400 V420" pathLength="100" stroke-dasharray="100" fill="none" stroke="#FFD400" stroke-width="4" stroke-linejoin="round"/>
  <path class="c3" d="M632,455.0 H600.0 V545.0 H568" pathLength="100" stroke-dasharray="100" fill="none" stroke="#FFD400" stroke-width="4" stroke-linejoin="round"/>
