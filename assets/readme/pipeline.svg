    @keyframes n1 { 0%, 14% { opacity: 0; } 15%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes n2 { 0%, 26% { opacity: 0; } 27%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes n3 { 0%, 38% { opacity: 0; } 39%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes n4 { 0%, 50% { opacity: 0; } 51%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes n5 { 0%, 62% { opacity: 0; } 63%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes c0 { 0%, 5% { stroke-dashoffset: 100; opacity: 1; } 14%, 92% { stroke-dashoffset: 0; opacity: 1; } 97% { stroke-dashoffset: 0; opacity: 0; } 98% { stroke-dashoffset: 100; opacity: 0; } 99%, 100% { stroke-dashoffset: 100; opacity: 1; } }
    @keyframes c1 { 0%, 17% { stroke-dashoffset: 100; opacity: 1; } 26%, 92% { stroke-dashoffset: 0; opacity: 1; } 97% { stroke-dashoffset: 0; opacity: 0; } 98% { stroke-dashoffset: 100; opacity: 0; } 99%, 100% { stroke-dashoffset: 100; opacity: 1; } }
    @keyframes c2 { 0%, 29% { stroke-dashoffset: 100; opacity: 1; } 38%, 92% { stroke-dashoffset: 0; opacity: 1; } 97% { stroke-dashoffset: 0; opacity: 0; } 98% { stroke-dashoffset: 100; opacity: 0; } 99%, 100% { stroke-dashoffset: 100; opacity: 1; } }
    @keyframes c3 { 0%, 41% { stroke-dashoffset: 100; opacity: 1; } 50%, 92% { stroke-dashoffset: 0; opacity: 1; } 97% { stroke-dashoffset: 0; opacity: 0; } 98% { stroke-dashoffset: 100; opacity: 0; } 99%, 100% { stroke-dashoffset: 100; opacity: 1; } }
    @keyframes c4 { 0%, 53% { stroke-dashoffset: 100; opacity: 1; } 62%, 92% { stroke-dashoffset: 0; opacity: 1; } 97% { stroke-dashoffset: 0; opacity: 0; } 98% { stroke-dashoffset: 100; opacity: 0; } 99%, 100% { stroke-dashoffset: 100; opacity: 1; } }
    @keyframes led { 0%, 70% { opacity: 0; } 71%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <defs><radialGradient id="glow"><stop offset="0" stop-color="#FFE45C" stop-opacity="0.95"/><stop offset="1" stop-color="#FFD400" stop-opacity="0"/></radialGradient></defs>
  <rect width="1200" height="772" rx="28" fill="#18181B"/>
  <text x="60" y="66" class="s b" font-size="26" fill="#F4F4F5">Browser</text>
  <text x="60" y="98" class="s" font-size="19" fill="#A2A2AA">React + Blockly, hosted on Vercel</text>
  <rect x="56" y="124" width="528" height="472" rx="20" fill="#1F1F23"/>
  <text x="620" y="66" class="s b" font-size="26" fill="#F4F4F5">Compile service</text>
  <text x="620" y="98" class="s" font-size="19" fill="#A2A2AA">Express, Redis, arduino-cli in Docker or on a VPS</text>
  <rect x="616" y="124" width="528" height="472" rx="20" fill="#1F1F23"/>
