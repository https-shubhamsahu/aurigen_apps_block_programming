    <g class="n4"><rect x="72" y="510" width="496" height="70" rx="14" fill="none" stroke="#FFD400" stroke-width="3"/><circle cx="108" cy="545.0" r="18" fill="#FFD400"/><text x="108" y="552.0" class="s b" font-size="20" fill="#17171A" text-anchor="middle">5</text></g>
    <text x="142" y="540" class="s b" font-size="22" fill="#F4F4F5">Browser fetches the images</text>
    <text x="142" y="566" class="m" font-size="19" fill="#A2A2AA">polls /api/status every 1.5 s</text>
  </g>
  <rect x="56" y="620" width="1088" height="132" rx="20" fill="#1F1F23"/>
  <g id="step-6">
    <rect x="72" y="636" width="748" height="100" rx="14" fill="#27272C" stroke="#3A3A40" stroke-width="2"/>
    <circle cx="108" cy="686.0" r="18" fill="#3A3A40"/>
    <text x="108" y="693.0" class="s b" font-size="20" fill="#F4F4F5" text-anchor="middle">6</text>
    <g class="n5"><rect x="72" y="636" width="748" height="100" rx="14" fill="none" stroke="#FFD400" stroke-width="3"/><circle cx="108" cy="686.0" r="18" fill="#FFD400"/><text x="108" y="693.0" class="s b" font-size="20" fill="#17171A" text-anchor="middle">6</text></g>
    <text x="142" y="666" class="s b" font-size="22" fill="#F4F4F5">esptool-js flashes over Web Serial</text>
    <text x="142" y="692" class="s" font-size="19" fill="#A2A2AA">DTR/RTS enter download mode, 4 images, then reset</text>
  </g>
