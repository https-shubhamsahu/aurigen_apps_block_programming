    <text x="702" y="450" class="s b" font-size="22" fill="#F4F4F5">arduino-cli builds it</text>
    <text x="702" y="476" class="m" font-size="19" fill="#A2A2AA">esp32:esp32:esp32, 180 s timeout</text>
  </g>
  <g id="step-5">
    <rect x="72" y="510" width="496" height="70" rx="14" fill="#27272C" stroke="#3A3A40" stroke-width="2"/>
    <circle cx="108" cy="545.0" r="18" fill="#3A3A40"/>
