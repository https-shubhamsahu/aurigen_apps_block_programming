<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="772" viewBox="0 0 1200 772" role="img" aria-labelledby="title desc">
  <title id="title">From block to board: the six steps of one compile and flash</title>
  <desc id="desc">Two lanes, Browser and Compile service, with a USB lane below. 1, in the browser: blocks become Arduino C++ in cppGenerator.js. 2, on the compile service: POST /api/compile checks the Supabase JWT, allows 6 compiles a minute and answers 202 with a job id. 3: the job joins a BullMQ queue on Redis, capped at 50. 4: arduino-cli compiles it with a 180 second timeout. 5, back in your browser: it polls /api/status every 1.5 seconds and downloads the images. 6, over USB: esptool-js writes four images over Web Serial and resets the ESP32, whose LED turns on.</desc>
  <style>
    .s { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'Noto Sans Mono', monospace; }
    .b { font-weight: 700; }
    .xb { font-weight: 800; }
    .n0 { animation-duration: 10s; animation-iteration-count: infinite; animation-timing-function: linear; animation-name: n0; }
    .n1 { animation-duration: 10s; animation-iteration-count: infinite; animation-timing-function: linear; animation-name: n1; }
    .n2 { animation-duration: 10s; animation-iteration-count: infinite; animation-timing-function: linear; animation-name: n2; }
    .n3 { animation-duration: 10s; animation-iteration-count: infinite; animation-timing-function: linear; animation-name: n3; }
    .n4 { animation-duration: 10s; animation-iteration-count: infinite; animation-timing-function: linear; animation-name: n4; }
    .n5 { animation-duration: 10s; animation-iteration-count: infinite; animation-timing-function: linear; animation-name: n5; }
    .c0 { animation-duration: 10s; animation-iteration-count: infinite; animation-timing-function: linear; animation-name: c0; animation-timing-function: ease-out; }
    .c1 { animation-duration: 10s; animation-iteration-count: infinite; animation-timing-function: linear; animation-name: c1; animation-timing-function: ease-out; }
    .c2 { animation-duration: 10s; animation-iteration-count: infinite; animation-timing-function: linear; animation-name: c2; animation-timing-function: ease-out; }
    .c3 { animation-duration: 10s; animation-iteration-count: infinite; animation-timing-function: linear; animation-name: c3; animation-timing-function: ease-out; }
    .c4 { animation-duration: 10s; animation-iteration-count: infinite; animation-timing-function: linear; animation-name: c4; animation-timing-function: ease-out; }
    .led { animation-duration: 10s; animation-iteration-count: infinite; animation-timing-function: linear; animation-name: led; }
