    <text x="142" y="180" class="s b" font-size="22" fill="#F4F4F5">Blocks become Arduino C++</text>
    <text x="142" y="206" class="s" font-size="19" fill="#A2A2AA">cppGenerator.js, pins checked per board</text>
  </g>
  <g id="step-2">
    <rect x="632" y="240" width="496" height="70" rx="14" fill="#27272C" stroke="#3A3A40" stroke-width="2"/>
    <circle cx="668" cy="275.0" r="18" fill="#3A3A40"/>
    <text x="668" y="282.0" class="s b" font-size="20" fill="#F4F4F5" text-anchor="middle">2</text>
    <g class="n1"><rect x="632" y="240" width="496" height="70" rx="14" fill="none" stroke="#FFD400" stroke-width="3"/><circle cx="668" cy="275.0" r="18" fill="#FFD400"/><text x="668" y="282.0" class="s b" font-size="20" fill="#17171A" text-anchor="middle">2</text></g>
    <text x="702" y="270" class="m b" font-size="22" fill="#F4F4F5">POST /api/compile</text>
    <text x="702" y="296" class="s" font-size="19" fill="#A2A2AA">Supabase JWT, 6 a minute, 202 + jobId</text>
  </g>
  <g id="step-3">
    <rect x="632" y="330" width="496" height="70" rx="14" fill="#27272C" stroke="#3A3A40" stroke-width="2"/>
    <circle cx="668" cy="365.0" r="18" fill="#3A3A40"/>
    <text x="668" y="372.0" class="s b" font-size="20" fill="#F4F4F5" text-anchor="middle">3</text>
